zhipu:
  api:
    key: af40b1f0c4074a41827f6f53e5a1597a.uWLtBtveaKk9jDZZ
    # 如果未设置环境变量ZHIPU_API_KEY，将使用模拟AI回复模式
    # 生产环境建议设置环境变量: export ZHIPU_API_KEY=your_api_key_here
    # 或直接在此处填写: key: your_api_key_here

# 日志配置
logging:
  level:
    root: INFO
    com.interview: INFO
    org.springframework: WARN
    org.hibernate: WARN
    org.hibernate.SQL: ERROR
    org.hibernate.type.descriptor.sql.BasicBinder: ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
